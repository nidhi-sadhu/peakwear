<header class="header">
  <a class="logo" routerLink="/">PeakWear</a>

  <nav class="header-nav">
    @if (store.isLoggedIn()) {
      <span class="user-name">{{ store.fullName() }}</span>
      <button mat-icon-button (click)="store.logout()" aria-label="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    } @else {
      <button mat-icon-button routerLink="/login" aria-label="Sign in">
        <mat-icon>person_outline</mat-icon>
      </button>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>
